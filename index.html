<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav id="navbar">
        <img id="logo" src="logo.svg" alt="Logo">
        <div style="display: flex; align-items: center; gap: 20px;">
            <ul style="list-style-type: none; padding: 0; display: flex; gap: 10px;">
                <li><a href="#">Home</a></li>
                <li><a href="#">Features</a></li>
                <li><a href="#">Community</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">Pricing</a></li>
            </ul>
            <button class="login-button">Register Now &rarr;</button>
        </div>
    </nav>
    <section class="home">
        <section id="hero" style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; padding-top: 40px; padding-bottom: 40px; padding-left: 130px; padding-right: 130px; background-color: #F5F7FA;">
            <div>
                <h1 style="font-size: 45px;">Lessons and insights <br> <span style="color: #4CAF4F;">from 8 years</span></h1>
                <p style="font-size: 12px; padding-bottom: 5px; color: gray;">Where to grow your business as a photographer: site or social media?</p>
                <button class="login-button">Register</button>
            </div>
            <div>
                <img style="height: 300px;" src="heroillustrator.svg" alt="">
            </div>
        </section>
        <section class="client" style="width: 50%; margin-left: auto; margin-right: auto; align-items: center; justify-content: center; display: flex; flex-direction: column; margin-top: 50px;">
            <h3 class="" style="font-size: 30px; color: #4D4D4D;">Our Clients</h3>
            <p style="font-size: 15px; color: #4D4D4D;">We have been working with some Fortune 500+ clients</p>
            <div class="comlogos">
                <img class="coml" src="comlogo1.svg" alt="">
                <img class="coml" src="comlogo2.svg" alt="">
                <img class="coml" src="comlogo3.svg" alt="">
                <img class="coml" src="comlogo4.svg" alt="">
                <img class="coml" src="comlogo5.svg" alt="">
                <img class="coml" src="comlogo6.svg" alt="">
                <img class="coml" src="comlogo7.svg" alt="">
            </div>
        </section>
    </section>

</html>
